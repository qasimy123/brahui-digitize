<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brahui Recording</title>
<style>
  :root { --bg:#faf8f3; --fg:#1d1b17; --muted:#6e6a62; --card:#fff; --accent:#8a3b12; --ok:#2f6b3a; --rec:#b3261e; --line:#e4dfd4; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15140f; --fg:#f1ede4; --muted:#a39d91; --card:#201e18; --accent:#e58f55; --ok:#7dc48b; --rec:#ff6b5e; --line:#33302a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 18px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; color:var(--muted); font-size:15px; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:10px 0 28px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); width:0; transition: width .3s; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 28px 22px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .label { color:var(--muted); font-size:14px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .sentence { font-size: 32px; line-height:1.3; font-weight:600; margin: 0 0 14px; }
  .hint { color:var(--muted); font-size:15px; min-height:22px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; align-items:center; }
  button { font: inherit; font-size:17px; padding:12px 18px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  button.rec { background:var(--rec); color:#fff; border-color:transparent; }
  button.ok { background:var(--ok); color:#fff; border-color:transparent; }
  button:disabled { opacity:.45; cursor:default; }
  .meter { width:100%; height:10px; background:var(--line); border-radius:5px; margin-top:18px; overflow:hidden; }
  .meter > div { height:100%; width:0; background:var(--ok); }
  .meter.hot > div { background:var(--rec); }
  audio { width:100%; margin-top:14px; }
  .status { margin-top:14px; font-size:15px; color:var(--muted); }
  .keys { margin-top:28px; color:var(--muted); font-size:14px; }
  kbd { font: 13px ui-monospace, Menlo, monospace; border:1px solid var(--line); border-radius:5px; padding:1px 6px; background:var(--card); }
  .done { color:var(--ok); }
</style>
</head>
<body>
<main>
  <header><div id="who"></div><div id="count"></div></header>
  <div class="bar"><div id="prog"></div></div>
  <section class="card">
    <div class="label">Say this in Brahui</div>
    <p class="sentence" id="sentence">Loading…</p>
    <div class="hint" id="hint"></div>
    <div class="meter" id="meter"><div></div></div>
    <audio id="player" controls hidden></audio>
    <div class="controls">
      <button id="back" title="previous (←)">← Back</button>
      <button id="recbtn" class="primary">● Record <kbd>Space</kbd></button>
      <button id="accept" class="ok" disabled>Accept &amp; next <kbd>Enter</kbd></button>
      <button id="redo" disabled>Redo <kbd>R</kbd></button>
      <button id="skip">Skip <kbd>S</kbd></button>
    </div>
    <div class="status" id="status"></div>
  </section>
  <p class="keys">Speak naturally, the way you would say it to a friend. If a sentence makes no sense for Brahui life, skip it. Pause half a second before and after speaking.</p>
</main>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const st = await (await fetch('/api/state')).json();
  const S = st.sentences; const done = st.done;
  $('who').textContent = 'Speaker: ' + st.speaker;
  let i = S.findIndex(s => !done[s.rec_id]); if (i < 0) i = 0;
  let rec = null, chunks = [], blob = null, stream = null, ctx = null, analyser = null, raf = null, recording = false;

  function render() {
    const s = S[i]; const n = Object.keys(done).length;
    $('sentence').textContent = s.en;
    $('count').textContent = `${n} / ${S.length} done`;
    $('prog').style.width = (100 * n / S.length) + '%';
    const d = done[s.rec_id];
    $('hint').innerHTML = d ? (d.skipped ? 'Previously skipped.' : `<span class="done">Recorded (${d.duration.toFixed(1)} s).</span> Record again to replace.`) : (s.source === 'generated' ? '' : 'Has a written Brahui reference.');
    $('player').hidden = true; blob = null; $('accept').disabled = true; $('redo').disabled = true; $('status').textContent = '';
    $('recbtn').textContent = '● Record'; $('recbtn').className = 'primary';
  }
  async function getStream() {
    if (stream) return stream;
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    ctx = new AudioContext(); analyser = ctx.createAnalyser(); analyser.fftSize = 1024; ctx.createMediaStreamSource(stream).connect(analyser);
    return stream;
  }
  function meter() {
    const buf = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(buf);
    let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v));
    const m = $('meter'); m.firstElementChild.style.width = Math.min(100, peak * 140) + '%'; m.classList.toggle('hot', peak > 0.9);
    raf = requestAnimationFrame(meter);
  }
  async function startRec() {
    await getStream(); chunks = [];
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
    rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 128000 } : {});
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => { blob = new Blob(chunks, { type: rec.mimeType }); $('player').src = URL.createObjectURL(blob); $('player').hidden = false; $('accept').disabled = false; $('redo').disabled = false; $('status').textContent = 'Listen back if you like, then Accept or Redo.'; };
    rec.start(); recording = true; meter();
    $('recbtn').textContent = '■ Stop'; $('recbtn').className = 'rec'; $('status').textContent = 'Recording…'; $('accept').disabled = true;
  }
  function stopRec() { if (rec && recording) { rec.stop(); recording = false; cancelAnimationFrame(raf); $('meter').firstElementChild.style.width = '0'; $('recbtn').textContent = '● Record'; $('recbtn').className = 'primary'; } }
  async function accept() {
    if (!blob) return; $('accept').disabled = true; $('status').textContent = 'Saving…';
    const r = await fetch('/api/upload?rec_id=' + S[i].rec_id, { method: 'POST', body: blob });
    const j = await r.json();
    if (!j.ok) { $('status').textContent = 'Save failed: ' + j.error; $('accept').disabled = false; return; }
    done[S[i].rec_id] = { duration: j.duration, skipped: false };
    if (j.peak > 0.98) { $('status').textContent = 'Saved, but the recording clipped. Move a little further from the mic.'; setTimeout(next, 1200); }
    else if (j.peak < 0.05) { $('status').textContent = 'Saved, but very quiet. Move closer to the mic.'; setTimeout(next, 1200); }
    else next();
  }
  async function skip() { await fetch('/api/skip?rec_id=' + S[i].rec_id, { method: 'POST' }); done[S[i].rec_id] = { duration: 0, skipped: true }; next(); }
  function next() { if (i < S.length - 1) { i++; render(); } else { render(); $('status').textContent = 'All sentences done. Thank you!'; } }
  function back() { if (i > 0) { i--; render(); } }

  $('recbtn').onclick = () => recording ? stopRec() : startRec();
  $('accept').onclick = accept; $('redo').onclick = startRec; $('skip').onclick = skip; $('back').onclick = back;
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); recording ? stopRec() : startRec(); }
    else if (e.key === 'Enter') { e.preventDefault(); accept(); }
    else if (e.key === 'r' || e.key === 'R') startRec();
    else if (e.key === 's' || e.key === 'S') skip();
    else if (e.key === 'ArrowLeft') back();
  });
  render();
})();
</script>
</body>
</html>
