[project]
name = "brahui-digitize"
version = "0.1.0"
description = "Brahui <-> English speech translation: ASR, MT and TTS for Brahui"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "anthropic>=0.40",
    "datasets>=5.1.0",
    "huggingface-hub<2",
    "jiwer>=3",
    "librosa>=0.10",
    "pandas>=2",
    "pyarrow>=15",
    "sacrebleu>=2.4",
    "sentencepiece>=0.2.2",
    "soundfile>=0.14.0",
    "torch>=2.4",
    "torchaudio>=2.4",
    "tqdm>=4.70.1",
    "transformers>=4.45",
]
